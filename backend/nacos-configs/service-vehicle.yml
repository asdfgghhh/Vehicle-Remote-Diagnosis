server:
  port: 9082

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:124.221.104.56}:${DB_PORT:3306}/vrd_vehicle?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}
  data:
    redis:
      host: ${REDIS_HOST:124.221.104.56}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
      password: ${REDIS_PASSWORD:change-me}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:124.221.104.56:9092}
    consumer:
      group-id: vehicle-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  task:
    scheduling:
      pool:
        size: 4

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

vrd:
  vehicle:
    kafka:
      consumer-topic: vehicle-data
      producer-topic: vehicle-data
      consumer-group-id: vehicle-processor
    # ===== 车辆在线状态管理 =====
    online:
      # Kafka：在线状态事件 Topic + 消费组
      status-event-topic: vehicle-online-status
      status-event-group-id: vehicle-online-status-processor
      stats-snapshot-topic: vehicle-online-stats
      # 离线超时：超过该分钟数无任何上报视为离线
      timeout-minutes: 5
      # 开启兜底超时扫描（生产必须 true）
      timeout-scan-enabled: true
      # Cron 表达式
      scan-cron: "0 * * * * ?"
      hourly-stat-cron: "0 0 * * * ?"
      daily-stat-cron: "0 0 0 * * ?"
      # Redis Key
      redis-key-ttl-seconds: 86400
      redis-hash-prefix: "vehicle:online:"
      redis-online-set-key: "vehicle:online:all"
      # 日志写入
      big-data-table-name: "vehicle_online_log"
      tdengine-stable-name: "stb_vehicle_online_log"
      log-write-batch-size: 500
      # 写入失败仅告警，不影响主流程
      log-write-degrade-on-error: true
  diagnosis-service-url: http://service-diagnosis:9087

file:
  upload:
    path: /data/vrd/uploads