version: '3.8'

# ============================================================
# VRD 微服务部署编排
# 说明:
#   - Nacos 已在宿主机 /opt/nacos 独立运行, 不在此编排
#   - Redis/Kafka/EMQX/MySQL/ClickHouse 均在宿主机 124.221.104.56 运行
#   - 服务通过 Nacos 配置中心的 ${ENV:default} 获取连接地址(默认指向宿主机)
#   - JVM 降配: 服务器仅 4GB 内存, 8 服务各限制堆 128MB (SerialGC)
# 用法:
#   export REGISTRY=124.221.104.56:8211 TAG=latest
#   docker compose pull && docker compose up -d --remove-orphans
# ============================================================

# 通用 JVM 参数 (覆盖镜像内默认 -Xms256m -Xmx512m, 防止 4GB 服务器 OOM)
x-java-opts: &java-opts
  JAVA_OPTS: "-Xms64m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/logs/heapdump.hprof -Djava.security.egd=file:/dev/./urandom"

services:
  # ==================== 微服务网关 ====================

  service-gateway:
    image: ${REGISTRY:-124.221.104.56:8211}/vrd/service-gateway:${TAG:-latest}
    container_name: vrd-gateway
    restart: always
    ports:
      - "9080:9080"
    environment:
      <<: *java-opts
      NACOS_SERVER_ADDR: ${NACOS_ADDR:-124.221.104.56:8848}
      NACOS_NAMESPACE: ${NACOS_NS:-57f964ac-059c-4e2b-8138-47bba2b9afb0}
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    volumes:
      - /data/vrd/logs/gateway:/logs
    networks:
      - vrd-network

  service-auth:
    image: ${REGISTRY:-124.221.104.56:8211}/vrd/service-auth:${TAG:-latest}
    container_name: vrd-auth
    restart: always
    ports:
      - "9081:9081"
    environment:
      <<: *java-opts
      NACOS_SERVER_ADDR: ${NACOS_ADDR:-124.221.104.56:8848}
      NACOS_NAMESPACE: ${NACOS_NS:-57f964ac-059c-4e2b-8138-47bba2b9afb0}
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    volumes:
      - /data/vrd/logs/auth:/logs
    networks:
      - vrd-network
    depends_on:
      service-gateway:
        condition: service_started

  service-vehicle:
    image: ${REGISTRY:-124.221.104.56:8211}/vrd/service-vehicle:${TAG:-latest}
    container_name: vrd-vehicle
    restart: always
    ports:
      - "9082:9082"
    environment:
      <<: *java-opts
      NACOS_SERVER_ADDR: ${NACOS_ADDR:-124.221.104.56:8848}
      NACOS_NAMESPACE: ${NACOS_NS:-57f964ac-059c-4e2b-8138-47bba2b9afb0}
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    volumes:
      - /data/vrd/logs/vehicle:/logs
    networks:
      - vrd-network
    depends_on:
      service-gateway:
        condition: service_started

  service-ecu-log:
    image: ${REGISTRY:-124.221.104.56:8211}/vrd/service-ecu-log:${TAG:-latest}
    container_name: vrd-ecu-log
    restart: always
    ports:
      - "9083:9083"
    environment:
      <<: *java-opts
      NACOS_SERVER_ADDR: ${NACOS_ADDR:-124.221.104.56:8848}
      NACOS_NAMESPACE: ${NACOS_NS:-57f964ac-059c-4e2b-8138-47bba2b9afb0}
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    volumes:
      - /data/vrd/logs/ecu-log:/logs
      - /data/vrd/data:/data
    networks:
      - vrd-network
    depends_on:
      service-gateway:
        condition: service_started

  service-dbc:
    image: ${REGISTRY:-124.221.104.56:8211}/vrd/service-dbc:${TAG:-latest}
    container_name: vrd-dbc
    restart: always
    ports:
      - "9084:9084"
    environment:
      <<: *java-opts
      NACOS_SERVER_ADDR: ${NACOS_ADDR:-124.221.104.56:8848}
      NACOS_NAMESPACE: ${NACOS_NS:-57f964ac-059c-4e2b-8138-47bba2b9afb0}
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    volumes:
      - /data/vrd/logs/dbc:/logs
      - /data/vrd/dbc:/dbc
    networks:
      - vrd-network
    depends_on:
      service-gateway:
        condition: service_started

  service-signal:
    image: ${REGISTRY:-124.221.104.56:8211}/vrd/service-signal:${TAG:-latest}
    container_name: vrd-signal
    restart: always
    ports:
      - "9085:9085"
    environment:
      <<: *java-opts
      NACOS_SERVER_ADDR: ${NACOS_ADDR:-124.221.104.56:8848}
      NACOS_NAMESPACE: ${NACOS_NS:-57f964ac-059c-4e2b-8138-47bba2b9afb0}
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    volumes:
      - /data/vrd/logs/signal:/logs
      - /data/vrd/signals:/signals
    networks:
      - vrd-network
    depends_on:
      service-gateway:
        condition: service_started

  service-access:
    image: ${REGISTRY:-124.221.104.56:8211}/vrd/service-access:${TAG:-latest}
    container_name: vrd-access
    restart: always
    ports:
      - "9086:9086"
    environment:
      <<: *java-opts
      NACOS_SERVER_ADDR: ${NACOS_ADDR:-124.221.104.56:8848}
      NACOS_NAMESPACE: ${NACOS_NS:-57f964ac-059c-4e2b-8138-47bba2b9afb0}
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    volumes:
      - /data/vrd/logs/access:/logs
    networks:
      - vrd-network
    depends_on:
      service-gateway:
        condition: service_started

  service-diagnosis:
    image: ${REGISTRY:-124.221.104.56:8211}/vrd/service-diagnosis:${TAG:-latest}
    container_name: vrd-diagnosis
    restart: always
    ports:
      - "9087:9087"
    environment:
      <<: *java-opts
      NACOS_SERVER_ADDR: ${NACOS_ADDR:-124.221.104.56:8848}
      NACOS_NAMESPACE: ${NACOS_NS:-57f964ac-059c-4e2b-8138-47bba2b9afb0}
      NACOS_USERNAME: nacos
      NACOS_PASSWORD: nacos
    volumes:
      - /data/vrd/logs/diagnosis:/logs
    networks:
      - vrd-network
    depends_on:
      service-gateway:
        condition: service_started

  # ==================== 前端 ====================

  frontend:
    image: ${REGISTRY:-124.221.104.56:8211}/vrd/frontend:${TAG:-latest}
    container_name: vrd-frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - /data/vrd/logs/frontend:/logs
    networks:
      - vrd-network
    depends_on:
      service-gateway:
        condition: service_started

networks:
  vrd-network:
    driver: bridge
